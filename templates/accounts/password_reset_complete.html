{% extends "base.html" %}
{% block title %}Password Reset Complete{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 text-center">
            <h3 class="mb-3 text-success">Password Reset Successful!</h3>
            <p class="text-muted">Your password has been changed. You can now log in with your new password.</p>
            <a href="{% url 'login' %}" class="btn btn-primary">Login Now</a>
        </div>
    </div>
</div>
{% endblock %}
